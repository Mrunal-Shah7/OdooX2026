name: Deploy OdooX2026

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "Connected to VPS"
            echo "Deploying OdooX2026..."

            cd /var/www/OdooX2026

            git fetch origin
            git reset --hard origin/main

            echo "Deployment code updated"