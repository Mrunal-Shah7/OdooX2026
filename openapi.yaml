        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        currency: { $ref: '#/components/schemas/Currency' }
        payoutCurrency: { $ref: '#/components/schemas/Currency' }
        exchangeRate: { $ref: '#/components/schemas/Rate' }
        scheduledDays: { $ref: '#/components/schemas/Quantity' }
        workedDays: { $ref: '#/components/schemas/Quantity' }
        paidLeaveDays: { $ref: '#/components/schemas/Quantity' }
        unpaidLeaveDays: { $ref: '#/components/schemas/Quantity' }
        absentDays: { $ref: '#/components/schemas/Quantity' }
        overtimeHours: { $ref: '#/components/schemas/Quantity' }
        proration: { type: string }
        basic: { $ref: '#/components/schemas/Money' }
        gross: { $ref: '#/components/schemas/Money' }
        totalDeductions: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/PayslipStatus' }
        archived: { type: boolean }
        sentAt: { type: [string, 'null'], format: date-time }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/PayslipWarning' }
