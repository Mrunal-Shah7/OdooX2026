components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pp_at

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Q:
      name: q
      in: query
      required: false
      description: Free-text search
      schema: { type: string, maxLength: 100 }
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string, maxLength: 40 }
    Order:
      name: order
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: asc }
    EmployeeId:
      name: employeeId
      in: query
      required: false
      schema: { type: string, format: uuid }
    DepartmentId:
      name: departmentId
      in: query
      required: false
      schema: { type: string, format: uuid }
    TimeOffTypeId:
      name: timeOffTypeId
      in: query
      required: false
      schema: { type: string, format: uuid }
    StructureId:
      name: structureId
      in: query
      required: false
      schema: { type: string, format: uuid }
    StructureIdRequired:
      name: structureId
      in: query
      required: true
      schema: { type: string, format: uuid }
    PayrunId:
      name: payrunId
      in: query
      required: false
      schema: { type: string, format: uuid }
    DateFrom:
      name: dateFrom
      in: query
      required: false
      schema: { type: string, format: date }
    DateTo:
      name: dateTo
      in: query
      required: false
      schema: { type: string, format: date }
    PeriodStart:
      name: periodStart
      in: query
      required: true
      schema: { type: string, format: date }
    PeriodEnd:
      name: periodEnd
      in: query
      required: true
      schema: { type: string, format: date }
    Period:
      name: period
      in: query
      required: false
      description: Calendar month as YYYY-MM
      schema: { type: string, pattern: '^\d{4}-\d{2}$' }
    Year:
      name: year
      in: query
      required: false
      schema: { type: integer, minimum: 2000, maximum: 2100 }
    AsOf:
      name: asOf
      in: query
      required: false
      schema: { type: string, format: date }
    WithinDays:
      name: withinDays
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 365, default: 60 }
    Format:
      name: format
      in: query
      required: false
      schema: { type: string, enum: [json, csv], default: json }
    ActiveOnly:
      name: activeOnly
      in: query
      required: false
      schema: { type: boolean, default: false }
    UnreadOnly:
      name: unreadOnly
      in: query
      required: false
      schema: { type: boolean, default: false }
    IncludeArchived:
      name: includeArchived
      in: query
      required: false
      schema: { type: boolean, default: false }
    RoleFilter:
      name: role
      in: query
      required: false
      schema: { $ref: '#/components/schemas/UserRole' }
    EmployeeTypeFilter:
      name: employeeType
      in: query
      required: false
      schema: { $ref: '#/components/schemas/EmployeeType' }
    EmployeeStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/EmployeeStatus' }
    ContractStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ContractStatus' }
    AttendanceStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/AttendanceStatus' }
    AllocationStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/AllocationStatus' }
    RequestStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/RequestStatus' }
    PayrunStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/PayrunStatus' }
    PayslipStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/PayslipStatus' }
    RuleCategoryFilter:
      name: category
      in: query
      required: false
      schema: { $ref: '#/components/schemas/RuleCategory' }

  responses:
    ValidationFailed:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Missing, expired or invalid access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource does not exist or is outside the caller's scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Illegal state transition, overlap or uniqueness violation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ReportOk:
      description: Report rows as JSON, or CSV when format=csv
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReportResponse' }
        text/csv:
          schema: { type: string }

  schemas:

    # --- enums -------------------------------------------------------------
    UserRole:
      type: string
      enum: [employee, hr_manager, hr_payroll_user, hr_payroll_manager, admin]
    UserStatus:
      type: string
      enum: [invited, active, disabled]
    Currency:
      type: string
      enum: [INR, USD]
    EmployeeType:
      type: string
      enum: [full_time, part_time, contract, intern]
    EmployeeStatus:
      type: string
      enum: [active, inactive]
    ContractStatus:
      type: string
      enum: [draft, running, expired, cancelled]
    AttendanceStatus:
      type: string
      enum: [present, late, absent, half_day, on_leave]
    TimeOffUnit:
      type: string
      enum: [days, hours]
    TimeOffDurationType:
      type: string
      enum: [full_day, half_day, hours]
    AllocationStatus:
      type: string
      enum: [draft, approved, refused]
    RequestStatus:
      type: string
      enum: [to_approve, approved, refused, cancelled]
    RuleCategory:
      type: string
      enum: [basic, allowance, gross, deduction, net]
    RuleComputation:
      type: string
      enum: [fixed, percentage, formula]
    PercentageBase:
      type: string
      enum: [contract_wage, basic, gross]
    PayrunStatus:
      type: string
      enum: [draft, computed, validated, paid]
    PayslipStatus:
      type: string
      enum: [draft, computed, done, paid]
    NotificationType:
      type: string
      enum: [time_off_requested, time_off_approved, time_off_refused, payslip_sent, payrun_validated]
    PayslipWarningCode:
      type: string
      enum: [MISSING_BANK_ACCOUNT, NO_ACTIVE_CONTRACT, DUPLICATE_PAYSLIP, CONTRACT_EXPIRING, ZERO_WORKED_DAYS, UNRECORDED_ATTENDANCE]

    # --- primitives ---------------------------------------------------------
    Money:
      type: string
      description: Decimal with two fraction digits, never a JSON number
      pattern: '^-?\d+\.\d{2}$'
    Quantity:
      type: string
      description: Decimal day or hour quantity with two fraction digits
      pattern: '^-?\d+\.\d{2}$'
    Rate:
      type: string
      description: Decimal exchange rate with up to six fraction digits

    # --- envelopes ----------------------------------------------------------
    PaginationMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL]
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }

    # --- shared entities ----------------------------------------------------
    EmployeeRef:
      type: object
      required: [id, firstName, lastName, workEmail]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        workEmail: { type: string, format: email }
        jobPosition: { type: [string, 'null'] }
        departmentName: { type: [string, 'null'] }
    DepartmentRef:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
    WorkingScheduleRef:
      type: object
      required: [id, name, hoursPerWeek]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hoursPerWeek: { $ref: '#/components/schemas/Quantity' }
    SalaryStructureRef:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
    TimeOffTypeRef:
      type: object
      required: [id, name, code, unit, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        unit: { $ref: '#/components/schemas/TimeOffUnit' }
        color: { type: string }

    # --- auth ---------------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    SetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
        password: { type: string, minLength: 8, maxLength: 128 }
    SessionUser:
      type: object
      required: [id, email, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        employee:
          oneOf:
            - { $ref: '#/components/schemas/EmployeeRef' }
            - { type: 'null' }
    SessionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SessionUser' }

    # --- users --------------------------------------------------------------
    User:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        employee:
          oneOf:
            - { $ref: '#/components/schemas/EmployeeRef' }
            - { type: 'null' }
    CreateUserRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        employeeId: { type: [string, 'null'], format: uuid }
    UpdateUserRequest:
      type: object
      properties:
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        employeeId: { type: [string, 'null'], format: uuid }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    UserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # --- employees ----------------------------------------------------------
    Employee:
      type: object
      required: [id, firstName, lastName, workEmail, department, jobPosition, workingSchedule, employeeType, status, joiningDate]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        workEmail: { type: string, format: email }
        personalEmail: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        department: { $ref: '#/components/schemas/DepartmentRef' }
        jobPosition: { type: string }
        workingSchedule: { $ref: '#/components/schemas/WorkingScheduleRef' }
        employeeType: { $ref: '#/components/schemas/EmployeeType' }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        joiningDate: { type: string, format: date }
        workLocation: { type: [string, 'null'] }
        bankName: { type: [string, 'null'] }
        bankAccountHolder: { type: [string, 'null'] }
        bankAccountLast4: { type: [string, 'null'] }
        bankIfsc: { type: [string, 'null'] }
        manager:
          oneOf:
            - { $ref: '#/components/schemas/EmployeeRef' }
            - { type: 'null' }
    EmployeeCounts:
      type: object
      required: [contracts, attendance, timeOff, allocations]
      properties:
        contracts: { type: integer }
        attendance: { type: integer }
        timeOff: { type: integer }
        allocations: { type: integer }
    EmployeeDetail:
      type: object
      required: [employee, counts]
      properties:
        employee: { $ref: '#/components/schemas/Employee' }
        counts: { $ref: '#/components/schemas/EmployeeCounts' }
    CreateEmployeeRequest:
      type: object
      required: [firstName, lastName, workEmail, departmentId, jobPosition, workingScheduleId, employeeType, joiningDate]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        workEmail: { type: string, format: email }
        personalEmail: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 20 }
        departmentId: { type: string, format: uuid }
        jobPosition: { type: string, minLength: 1, maxLength: 80 }
        managerId: { type: [string, 'null'], format: uuid }
        workingScheduleId: { type: string, format: uuid }
        employeeType: { $ref: '#/components/schemas/EmployeeType' }
        joiningDate: { type: string, format: date }
        workLocation: { type: [string, 'null'], maxLength: 80 }
        bankName: { type: [string, 'null'], maxLength: 80 }
        bankAccountHolder: { type: [string, 'null'], maxLength: 80 }
        bankAccountNumber: { type: [string, 'null'], maxLength: 34 }
        bankIfsc: { type: [string, 'null'], maxLength: 20 }
    UpdateEmployeeRequest:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        personalEmail: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 20 }
        departmentId: { type: string, format: uuid }
        jobPosition: { type: string, minLength: 1, maxLength: 80 }
        managerId: { type: [string, 'null'], format: uuid }
        workingScheduleId: { type: string, format: uuid }
        employeeType: { $ref: '#/components/schemas/EmployeeType' }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        workLocation: { type: [string, 'null'], maxLength: 80 }
        bankName: { type: [string, 'null'], maxLength: 80 }
        bankAccountHolder: { type: [string, 'null'], maxLength: 80 }
        bankAccountNumber: { type: [string, 'null'], maxLength: 34 }
        bankIfsc: { type: [string, 'null'], maxLength: 20 }
    EmployeeResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Employee' }
    EmployeeDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/EmployeeDetail' }
    EmployeeListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # --- departments --------------------------------------------------------
    Department:
      type: object
      required: [id, name, code, headcount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        headcount: { type: integer }
        manager:
          oneOf:
            - { $ref: '#/components/schemas/EmployeeRef' }
            - { type: 'null' }
    CreateDepartmentRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        code: { type: string, minLength: 1, maxLength: 8 }
        managerId: { type: [string, 'null'], format: uuid }
    UpdateDepartmentRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        code: { type: string, minLength: 1, maxLength: 8 }
        managerId: { type: [string, 'null'], format: uuid }
    DepartmentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Department' }
    DepartmentListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Department' }

    # --- contracts ----------------------------------------------------------
    Contract:
      type: object
      required: [id, reference, employee, department, jobPosition, workingSchedule, salaryStructure, startDate, wage, currency, status]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        employee: { $ref: '#/components/schemas/EmployeeRef' }
        department: { $ref: '#/components/schemas/DepartmentRef' }
        jobPosition: { type: string }
        workingSchedule: { $ref: '#/components/schemas/WorkingScheduleRef' }
        salaryStructure: { $ref: '#/components/schemas/SalaryStructureRef' }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        wage: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/ContractStatus' }
        notes: { type: [string, 'null'] }
    CreateContractRequest:
      type: object
      required: [employeeId, departmentId, jobPosition, workingScheduleId, salaryStructureId, startDate, wage, currency]
      properties:
        employeeId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        jobPosition: { type: string, minLength: 1, maxLength: 80 }
        workingScheduleId: { type: string, format: uuid }
        salaryStructureId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        wage: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/ContractStatus' }
        notes: { type: [string, 'null'], maxLength: 1000 }
    UpdateContractRequest:
      type: object
      properties:
        departmentId: { type: string, format: uuid }
        jobPosition: { type: string, minLength: 1, maxLength: 80 }
        workingScheduleId: { type: string, format: uuid }
        salaryStructureId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        wage: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/ContractStatus' }
        notes: { type: [string, 'null'], maxLength: 1000 }
    ContractResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Contract' }
    ContractListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Contract' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # --- schedules ----------------------------------------------------------
    WorkingScheduleDay:
      type: object
      required: [dayOfWeek, startTime, endTime, breakHours, hours]
      properties:
        id: { type: string, format: uuid }
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        breakHours: { $ref: '#/components/schemas/Quantity' }
        hours: { $ref: '#/components/schemas/Quantity' }
    WorkingSchedule:
      type: object
      required: [id, name, timezone, daysPerWeek, hoursPerWeek, active, days]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        daysPerWeek: { type: integer }
        hoursPerWeek: { $ref: '#/components/schemas/Quantity' }
        active: { type: boolean }
        employeeCount: { type: integer }
        days:
          type: array
          items: { $ref: '#/components/schemas/WorkingScheduleDay' }
    WorkingScheduleDayInput:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        breakHours: { $ref: '#/components/schemas/Quantity' }
    CreateWorkingScheduleRequest:
      type: object
      required: [name, days]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        active: { type: boolean, default: true }
        days:
          type: array
          minItems: 1
          maxItems: 7
          items: { $ref: '#/components/schemas/WorkingScheduleDayInput' }
    UpdateWorkingScheduleRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        active: { type: boolean }
        days:
          type: array
          minItems: 1
          maxItems: 7
          items: { $ref: '#/components/schemas/WorkingScheduleDayInput' }
    WorkingScheduleResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/WorkingSchedule' }
    WorkingScheduleListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WorkingSchedule' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    PublicHoliday:
      type: object
      required: [id, name, date]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        date: { type: string, format: date }
    CreatePublicHolidayRequest:
      type: object
      required: [name, date]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        date: { type: string, format: date }
    PublicHolidayResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PublicHoliday' }
    PublicHolidayListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PublicHoliday' }

    # --- attendance ---------------------------------------------------------
    AttendanceRecord:
      type: object
      required: [id, employee, date, workedHours, overtimeHours, status, isManualEdit]
      properties:
        id: { type: string, format: uuid }
        employee: { $ref: '#/components/schemas/EmployeeRef' }
        date: { type: string, format: date }
        checkIn: { type: [string, 'null'], format: date-time }
        checkOut: { type: [string, 'null'], format: date-time }
        workedHours: { $ref: '#/components/schemas/Quantity' }
        overtimeHours: { $ref: '#/components/schemas/Quantity' }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        notes: { type: [string, 'null'] }
        isManualEdit: { type: boolean }
    ActiveAttendance:
      type: object
      required: [checkedIn]
      properties:
        checkedIn: { type: boolean }
        record:
          oneOf:
            - { $ref: '#/components/schemas/AttendanceRecord' }
            - { type: 'null' }
        todayWorkedHours: { $ref: '#/components/schemas/Quantity' }
    CreateAttendanceRequest:
      type: object
      required: [employeeId, date, status]
      properties:
        employeeId: { type: string, format: uuid }
        date: { type: string, format: date }
        checkIn: { type: [string, 'null'], format: date-time }
        checkOut: { type: [string, 'null'], format: date-time }
        overtimeHours: { $ref: '#/components/schemas/Quantity' }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        notes: { type: [string, 'null'], maxLength: 500 }
    UpdateAttendanceRequest:
      type: object
      properties:
        checkIn: { type: [string, 'null'], format: date-time }
        checkOut: { type: [string, 'null'], format: date-time }
        overtimeHours: { $ref: '#/components/schemas/Quantity' }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        notes: { type: [string, 'null'], maxLength: 500 }
    AttendanceResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AttendanceRecord' }
    ActiveAttendanceResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ActiveAttendance' }
    AttendanceListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AttendanceRecord' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # --- time off -----------------------------------------------------------
    TimeOffType:
      type: object
      required: [id, name, code, unit, requiresAllocation, isPaid, approvalRole, color, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        unit: { $ref: '#/components/schemas/TimeOffUnit' }
