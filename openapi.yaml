openapi: 3.1.0

info:
  title: PeoplePay360 API
  version: 1.0.0
  description: >
    Integrated HR and payroll API. Employees, contracts, working schedules, attendance,
    time off, salary structures and rules, pay runs, payslips, dashboard and reports.
    All money values are decimal strings. All calendar dates are YYYY-MM-DD strings.

servers:
  - url: http://localhost:4000
    description: Local

tags:
  - name: auth
  - name: users
  - name: employees
  - name: contracts
  - name: schedules
  - name: attendance
  - name: timeoff
  - name: payroll
  - name: dashboard
  - name: reports
  - name: notifications

security:
  - sessionCookie: []

paths:

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for session cookies
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session issued; sets pp_at and pp_rt cookies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the refresh token and clear cookies
      responses:
        '204': { description: Session ended }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      security: []
      responses:
        '200':
          description: New session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Current user, role and linked employee
      responses:
        '200':
          description: Current session user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/auth/forgot-password:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Email a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '204': { description: Always returned, whether or not the email exists }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /api/auth/set-password:
    post:
      tags: [auth]
      operationId: setPassword
      summary: Consume an invite or reset token and set a password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
      responses:
        '204': { description: Password set; the user may now sign in }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Paginated user list
      parameters:
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/RoleFilter' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user and send the invite email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/users/{id}:
    get:
      tags: [users]
      operationId: getUser
      summary: Single user
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Change role, status or employee linkage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/users/{id}/resend-invite:
    post:
      tags: [users]
      operationId: resendInvite
      summary: Reissue the invite token and email
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Invite reissued }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/employees:
    get:
      tags: [employees]
      operationId: listEmployees
      summary: Paginated, filterable employee list
      parameters:
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/DepartmentId' }
        - { $ref: '#/components/parameters/EmployeeTypeFilter' }
        - { $ref: '#/components/parameters/EmployeeStatusFilter' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Order' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Employee list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [employees]
      operationId: createEmployee
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmployeeRequest' }
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/employees/{id}:
    get:
      tags: [employees]
      operationId: getEmployee
      summary: Employee with smart-button counts
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Employee detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [employees]
      operationId: updateEmployee
      summary: Update an employee
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmployeeRequest' }
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/departments:
    get:
      tags: [employees]
      operationId: listDepartments
      summary: Department list with headcount
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [employees]
      operationId: createDepartment
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDepartmentRequest' }
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/departments/{id}:
    patch:
      tags: [employees]
      operationId: updateDepartment
      summary: Update a department
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDepartmentRequest' }
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [employees]
      operationId: deleteDepartment
      summary: Delete a department that has no employees
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Department deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/contracts:
    get:
      tags: [contracts]
      operationId: listContracts
      summary: Paginated, filterable contract list
      parameters:
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/EmployeeId' }
        - { $ref: '#/components/parameters/ContractStatusFilter' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Contract list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [contracts]
      operationId: createContract
      summary: Create a contract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContractRequest' }
      responses:
        '201':
          description: Contract created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/contracts/{id}:
    get:
      tags: [contracts]
      operationId: getContract
      summary: Single contract
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Contract detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [contracts]
      operationId: updateContract
      summary: Update a contract or change its status
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContractRequest' }
      responses:
        '200':
          description: Contract updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/working-schedules:
    get:
      tags: [schedules]
      operationId: listWorkingSchedules
      summary: Schedule list with derived weekly hours
      parameters:
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Schedule list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingScheduleListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [schedules]
      operationId: createWorkingSchedule
      summary: Create a schedule with its day rows
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkingScheduleRequest' }
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingScheduleResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/working-schedules/{id}:
    get:
      tags: [schedules]
      operationId: getWorkingSchedule
      summary: Schedule with day rows
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Schedule detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingScheduleResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [schedules]
      operationId: updateWorkingSchedule
      summary: Replace the day rows and recompute derived totals
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkingScheduleRequest' }
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingScheduleResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/public-holidays:
    get:
      tags: [schedules]
      operationId: listPublicHolidays
      summary: Holidays in a year
      parameters: [{ $ref: '#/components/parameters/Year' }]
      responses:
        '200':
          description: Holiday list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicHolidayListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [schedules]
      operationId: createPublicHoliday
      summary: Add a public holiday
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePublicHolidayRequest' }
      responses:
        '201':
          description: Holiday created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicHolidayResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/public-holidays/{id}:
    delete:
      tags: [schedules]
      operationId: deletePublicHoliday
      summary: Remove a public holiday
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Holiday removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/attendance:
    get:
      tags: [attendance]
      operationId: listAttendance
      summary: Paginated, filterable attendance list
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
        - { $ref: '#/components/parameters/DepartmentId' }
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
        - { $ref: '#/components/parameters/AttendanceStatusFilter' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Attendance list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [attendance]
      operationId: createAttendance
      summary: Create an attendance record manually
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAttendanceRequest' }
      responses:
        '201':
          description: Attendance created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/attendance/active:
    get:
      tags: [attendance]
      operationId: getActiveAttendance
      summary: Today's open session for the check-in widget
      responses:
        '200':
          description: Widget state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveAttendanceResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/attendance/check-in:
    post:
      tags: [attendance]
      operationId: checkIn
      summary: Open today's attendance session for the current user
      responses:
        '201':
          description: Checked in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/attendance/check-out:
    post:
      tags: [attendance]
      operationId: checkOut
      summary: Close today's attendance session for the current user
      responses:
        '200':
          description: Checked out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/attendance/{id}:
    get:
      tags: [attendance]
      operationId: getAttendance
      summary: Single attendance record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Attendance detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [attendance]
      operationId: updateAttendance
      summary: Correct an attendance record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAttendanceRequest' }
      responses:
        '200':
          description: Attendance updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off/types:
    get:
      tags: [timeoff]
      operationId: listTimeOffTypes
      summary: Time off type list
      parameters:
        - { $ref: '#/components/parameters/ActiveOnly' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Type list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffTypeListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [timeoff]
      operationId: createTimeOffType
      summary: Create a time off type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTimeOffTypeRequest' }
      responses:
        '201':
          description: Type created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffTypeResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/time-off/types/{id}:
    get:
      tags: [timeoff]
      operationId: getTimeOffType
      summary: Single time off type
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Type detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffTypeResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [timeoff]
      operationId: updateTimeOffType
      summary: Update a time off type
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTimeOffTypeRequest' }
      responses:
        '200':
          description: Type updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffTypeResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off/allocations:
    get:
      tags: [timeoff]
      operationId: listAllocations
      summary: Allocations with derived taken and remaining
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
        - { $ref: '#/components/parameters/TimeOffTypeId' }
        - { $ref: '#/components/parameters/AllocationStatusFilter' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Allocation list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [timeoff]
      operationId: createAllocation
      summary: Create an allocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAllocationRequest' }
      responses:
        '201':
          description: Allocation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/time-off/allocations/{id}:
    get:
      tags: [timeoff]
      operationId: getAllocation
      summary: Single allocation
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Allocation detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
