        error: { type: [string, 'null'] }
    PayrunResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Payrun' }
    PayrunDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PayrunDetail' }
    PayrunListResponse:
      type: object
      required: [data, meta]
